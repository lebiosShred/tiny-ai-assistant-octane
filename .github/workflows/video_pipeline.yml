name: Enterprise Video Rendering Pipeline

on:
  push:
    branches:
      - main
      - tiny-ai-assistant
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.44.0-jammy
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: |
          apt-get update && apt-get install -y python3-pip ffmpeg
          pip3 install --no-cache-dir playwright edge-tts imageio-ffmpeg pyautogui pillow
          playwright install --with-deps

      - name: Start Local Mock Server
        run: |
          npm install -g serve
          serve -l 8080 demo &
          sleep 3 # Wait for server

      - name: Execute Playwright Video Renderer
        run: |
          # Headless mode wrapper (uses Xvfb in the Playwright container)
          xvfb-run python3 demo/screencast/record_playwright.py

      - name: Compile and Assemble MP4
        run: |
          xvfb-run python3 demo/screencast/assemble_screencast.py

      - name: Archive MP4 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-video-courses
          path: demo/screencast/output/*.mp4
          retention-days: 14
