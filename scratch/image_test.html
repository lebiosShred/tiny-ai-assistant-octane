<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Crop Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .hero__hosts {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .host-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(77, 174, 235, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            flex: 1;
            min-width: 240px;
        }
        .host-avatar-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #4daeeb;
            flex-shrink: 0;
            background: #ffffff; /* Use white background to blend since original images have white backgrounds */
        }
        .host-avatar {
            width: 100%;
            height: 100%;
            display: block;
        }
        .host-avatar--square {
            object-fit: cover;
        }
        .host-avatar--tall {
            object-fit: cover;
            object-position: center 10%;
        }
        .host-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .host-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0;
        }
        .host-role {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>SDR Profile Crop Test</h2>
        <div class="hero__hosts">
            <div class="host-card">
                <div class="host-avatar-wrapper">
                    <img src="../demo/albert.png" alt="Albert" class="host-avatar host-avatar--square">
                </div>
                <div class="host-info">
                    <h3 class="host-name">Albert</h3>
                    <p class="host-role">Sales Development Representative</p>
                </div>
            </div>
            <div class="host-card">
                <div class="host-avatar-wrapper">
                    <img src="../demo/isha.png" alt="Isha" class="host-avatar host-avatar--tall">
                </div>
                <div class="host-info">
                    <h3 class="host-name">Isha</h3>
                    <p class="host-role">Sales Development Representative</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
